# Local-only EvidenceGraph phase 1 stack: API, PDF/graph worker, React workspace,
# and the legacy Streamlit fallback.
name: evidencegraph-stage0

services:
  agent_service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    env_file:
      - .env
    environment:
      # Containers must listen on all container interfaces; the published port
      # below remains bound to the Windows loopback interface only.
      HOST: 0.0.0.0
      SQLITE_DB_PATH: /app/data/stage0-smoke.db
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Also persists /app/data/evidencegraph across container recreation.
      - stage0_sqlite:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  paper_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
    command: ["python", "-m", "evidencegraph.paper_worker"]
    env_file:
      - .env
    environment:
      EVIDENCEGRAPH_DATA_DIR: /app/data/evidencegraph
      LOG_LEVEL: INFO
    volumes:
      - stage0_sqlite:/app/data
      - stage0_models:/root/.cache/huggingface
    restart: "on-failure:3"

  streamlit_app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    environment:
      AGENT_URL: http://agent_service:8080
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      agent_service:
        condition: service_healthy

  web_app:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      agent_service:
        condition: service_healthy

volumes:
  stage0_sqlite:
  stage0_models:
