map $http_cf_connecting_ip $evidencegraph_client_ip {
    # Cloudflare sets this header on Tunnel traffic. Local-only access falls
    # back to the direct peer address for development and SSH forwarding.
    default $http_cf_connecting_ip;
    "" $remote_addr;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    # Recreated Compose containers can receive a different address. Resolve at
    # request time instead of retaining the API's startup address forever.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_backend http://agent_service:8080;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        # Replace client-supplied forwarding headers with the edge visitor IP.
        # The origin is loopback-only; Tunnel is its only public entry point.
        proxy_set_header X-Real-IP $evidencegraph_client_ip;
        proxy_set_header X-Forwarded-For $evidencegraph_client_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
